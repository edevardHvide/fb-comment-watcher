[project]
name = "fb-comment-watcher"
version = "0.1.0"
description = "Local Facebook post comment watcher with auto-Messenger DM and Streamlit UI."
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48",
    "streamlit>=1.40",
    "pyyaml>=6.0",
    "psutil>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
